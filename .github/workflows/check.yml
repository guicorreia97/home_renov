name: check

# CI runs the exact same gate as the pre-commit hook (`make check`), so there is
# one definition of "done". The hook is local and skippable; this is not.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Run quality gate
        run: make check
