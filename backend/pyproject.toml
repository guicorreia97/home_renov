[project]
name = "app"
version = "0.1.0"
description = "home_renov backend — FastAPI service for managing a home renovation project"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.3",
    "uvicorn>=0.32.0",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.6.0",
    "overrides>=7.7.0",
]

[project.scripts]
start = "app.api.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "config"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# S105-S107 catch hardcoded passwords in source. gitleaks covers token-shaped
# secrets; these catch the plain-string case it cannot pattern-match.
select = ["E", "F", "I", "UP", "B", "ANN", "T20", "S105", "S106", "S107"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S105", "S106", "S107"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
