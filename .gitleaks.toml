# Secret scanning config. Runs as part of `make check`, so it gates every
# commit locally and every push in CI.
#
# Start from the bundled ruleset (~150 provider token patterns), then add what
# is specific to this project.
[extend]
useDefault = true

# --- Project-specific rules -------------------------------------------------

# Credentials embedded in a connection string. The default ruleset does not
# cover these: they match no vendor token format, which is exactly how a
# hardcoded "postgres://admin:hunter2@prod-db/renov" slips through unnoticed.
[[rules]]
id = "connection-string-password"
description = "Password embedded in a database or service connection URI"
regex = '''(?i)\b(?:postgres|postgresql|mongodb(?:\+srv)?|mysql|redis|amqp|https?)://[^\s:@/]+:([^\s:@/]{3,})@'''
secretGroup = 1
tags = ["password", "connection-string"]

[rules.allowlist]
# Match against the whole line, not just the captured secret. The patterns below
# include the surrounding ":" and "@" for precision, and gitleaks' default
# regexTarget of "secret" would test them against the password alone — so every
# one of them would silently never match.
regexTarget = "line"
# Placeholders that are obviously not real credentials.
regexes = [
  '''(?i):(\*{3,}|x{3,}|<[^>]+>|\$\{[^}]+\}|password|pass|changeme|placeholder|your[-_]?password)@''',
]

# AWS access key IDs. Verified against gitleaks 8.30: the bundled ruleset does
# not flag a bare AKIA/ASIA identifier on its own, and an AWS key ID is too
# common a leak to rely on the generic high-entropy rule catching it.
[[rules]]
id = "aws-access-key-id"
description = "AWS access key ID"
regex = '''\b((?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16})\b'''
secretGroup = 1
tags = ["aws", "key-id"]

[rules.allowlist]
# The identifiers AWS itself publishes in its documentation.
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''ASIAIOSFODNN7EXAMPLE''',
]

# --- Global allowlist -------------------------------------------------------

[allowlist]
description = "Files that hold deliberate dummy values, plus generated artifacts"

paths = [
  # Committed on purpose with fake values so tests and CI can boot the app.
  # See docs/backend-guide.md. Real credentials never belong in these.
  '''backend/config/envs/\.env\.example$''',
  '''backend/config/envs/\.env\.testing$''',

  # Lockfile: hashes and URLs, no credentials, and very noisy to scan.
  '''backend/uv\.lock$''',

  # Generated bundle. `make check` builds it, and gitleaks' `dir` mode does not
  # honour .gitignore — verified: a key planted in frontend/dist/ is reported.
  # Without this, every gate run rescans frontend/src through its bundled copy
  # and adds vendored dependency code, whose example keys are false positives;
  # a gate that cries wolf is a gate people bypass. This hides nothing: dist is
  # generated from frontend/src, which is still scanned, and it is gitignored,
  # so no credential can reach git through it.
  '''^frontend/dist/''',

  # This file: its own regexes look like the things they match.
  '''\.gitleaks\.toml$''',
]
