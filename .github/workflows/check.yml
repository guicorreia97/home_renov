name: check

# CI runs the exact same gate as the pre-commit hook (`make check`), so there is
# one definition of "done". The hook is local and skippable; this is not.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # This name is the required status check on `main`. Branch protection waits
    # for a check reporting exactly "quality gate" — a check that never reports
    # stays *pending*, not failed, so every PR blocks on a grey dot that looks
    # like slow CI. Three edits break it: renaming this `name:`, removing it
    # (the job key `check` becomes the name instead), and adding a `paths:`
    # filter above that skips this workflow on some PRs. Change it here and in
    # protection together:
    #   gh api repos/{owner}/{repo}/branches/main/protection
    name: quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the secret scan can inspect past commits, not just
          # the tip. A credential committed earlier and reverted is still leaked.
          fetch-depth: 0

      # Installs the MIT-licensed binary directly. The official gitleaks Action
      # requires a paid license for organization-owned repos; this does not.
      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Run quality gate
        run: make check

      - name: Scan git history for secrets
        run: make secrets-history
